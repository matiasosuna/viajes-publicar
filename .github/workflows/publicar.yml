# Publica lo que toca de cola.json (nube.py), como Myths on Clay: la Mac puede estar apagada.
# Corre a los :20 de cada hora; si algo vence en la próxima hora, espera y sale a la hora justa
# (GitHub atrasa el cron hasta ~50 min: el 15/10 la corrida de las 12:50 HST arrancó 12:41... de la hora anterior).
# A mano: gh workflow run publicar -R matiasosuna/viajes-publicar
name: publicar
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # hasta 70 min de espera + publicar
    steps:
      - uses: actions/checkout@v4
      - name: publicar lo que toca
        env:
          GH_TOKEN: ${{ github.token }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CANAL: ${{ secrets.BUFFER_TIKTOK_CANAL }}
        run: python3 nube.py
      - name: guardar la cola
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cola.json
          git diff --cached --quiet && exit 0
          git commit -m "cola: publicado"
          git pull --rebase && git push
